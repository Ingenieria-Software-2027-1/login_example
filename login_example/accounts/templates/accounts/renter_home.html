<!DOCTYPE html>
<html lang="es">
<head><title>Buscar Espacios</title></head>
<body style="background-color: #e8f5e9; font-family: sans-serif; padding: 20px;">

    <h2 style="color: #2e7d32;">Buscador de Espacios</h2>
    <p>Hola <strong>{{ request.user.username }}</strong>, ¿Qué lugar necesitas reservar hoy?</p>
    
    <div style="background: white; padding: 20px; border-radius: 5px; border: 1px solid #c8e6c9;">
        <input type="text" placeholder="Buscar por ciudad o zona..." style="padding: 5px;">
        <button>Buscar</button>
    </div>

    <p><a href="{% url 'catalogo' %}">Ver catálogo de espacios</a></p>

    <br>
    <form action="{% url 'logout' %}" method="POST">
        {% csrf_token %}
        <button type="submit">Cerrar Sesión</button>
    </form>

</body>
</html>
