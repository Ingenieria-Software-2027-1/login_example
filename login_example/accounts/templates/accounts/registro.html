<!DOCTYPE html>
<html lang="es">
<head><title>Registro - B2B</title></head>
<body style="font-family: sans-serif; padding: 40px;">

    <h2>Crear una nueva cuenta</h2>
    <p>Únete como anfitrión o arrendatario.</p>

    <form method="POST">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" style="background: green; color: white; padding: 10px;">
            Registrarme
        </button>
    </form>
    
    <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a></p>

</body>
</html>
