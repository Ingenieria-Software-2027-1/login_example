<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Espacios{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-custom { border: none; border-radius: 12px; transition: all 0.2s ease-in-out; }
        .card-custom:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'catalogo_espacios' %}">
                <i class="bi bi-building me-2"></i>Módulo Espacios
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-text text-light small">
                    <i class="bi bi-person-circle me-1"></i>{{ user.username }}
                </span>
                <a href="{% url 'catalogo_espacios' %}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-grid-3x3-gap me-1"></i>Catálogo
                </a>
                <a href="{% url 'crear_espacio' %}" class="btn btn-success btn-sm">
                    <i class="bi bi-plus-circle me-1"></i>Nuevo Espacio
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-top text-center py-3 text-muted small mt-auto">
        Práctica 03 - Ingeniería de Software
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
